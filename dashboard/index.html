<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trippix Fleet Live | Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#0b2a6b;--navy2:#071a45;--navy3:#050f2b;--gold:#f2b72e;--gold2:#ffd86b;--ink:#e8eefc;--mut:#8ea0cc;--line:rgba(255,255,255,.08);--card:rgba(255,255,255,.045);--ok:#35d49a;--bad:#ff5d6c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy3);color:var(--ink);font-family:Inter,'Noto Kufi Arabic',system-ui,sans-serif;overflow:hidden}
body.ar{font-family:'Noto Kufi Arabic',Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:392px 1fr;height:100vh}
body.ar .app{direction:rtl}
.side{background:linear-gradient(180deg,#081d4e 0%,#050f2b 100%);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;z-index:5}
.brand{padding:18px 20px 12px;display:flex;align-items:center;gap:14px}
.brand img{width:92px;height:auto;filter:drop-shadow(0 4px 14px rgba(242,183,46,.25))}
.brand .t{line-height:1.2}.brand .t b{font-size:15px;letter-spacing:.4px;display:block}
.brand .t span{font-size:11px;color:var(--mut);letter-spacing:.3px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ok);letter-spacing:1.2px;margin-top:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(53,212,154,.7);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(53,212,154,0)}100%{box-shadow:0 0 0 0 rgba(53,212,154,0)}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 16px 10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{display:block;font-size:10px;color:var(--mut);letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.kpi b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}.kpi b u{text-decoration:none;font-size:11px;color:var(--mut);font-weight:500;margin-inline-start:3px}
.kpi.kg b{color:var(--gold)}
.tabs{display:flex;gap:6px;padding:4px 16px 10px}
.tab{font:inherit;font-size:11.5px;font-weight:600;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;transition:.2s}
.tab.on{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.list{flex:1;overflow-y:auto;padding:0 12px 10px;min-height:0}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px}
.v{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.v:hover{background:rgba(255,255,255,.075)}
.v.sel{border-color:var(--gold);background:linear-gradient(90deg,rgba(242,183,46,.14),rgba(255,255,255,.04));box-shadow:0 0 0 1px rgba(242,183,46,.25),0 8px 24px rgba(0,0,0,.35)}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.ic svg{width:26px;height:26px}
.v .n{font-size:13px;font-weight:700;display:flex;gap:7px;align-items:center}
.v .n em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.8px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--mut)}
.v .n em.lux{background:rgba(242,183,46,.18);color:var(--gold)}
.v .d{font-size:11.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.fb{height:5px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.fb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .6s}
.fb i.low{background:linear-gradient(90deg,#ff5d6c,#ff9a5d)}
.v .r{text-align:end}.v .r b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}.v .r b u{font-size:10px;color:var(--mut);text-decoration:none;font-weight:500;margin-inline-start:2px}
.v .r span{display:block;font-size:11px;color:var(--gold);font-weight:600;margin-top:2px}
.ev{border-top:1px solid var(--line);padding:10px 16px 12px;background:rgba(0,0,0,.18);height:150px;overflow:hidden}
.ev h4{font-size:10px;letter-spacing:1.2px;color:var(--mut);margin-bottom:6px;text-transform:uppercase}
.ev div{font-size:11.5px;color:#c3cff0;padding:3px 0;display:flex;gap:8px;animation:fi .5s}
.ev div time{color:var(--mut);font-variant-numeric:tabular-nums;min-width:40px}
.ev div.w{color:#ffb4bb}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}}
.mapw{position:relative;min-width:0}
#map{position:absolute;inset:0;background:#0a1330}
.leaflet-tile-pane{filter:invert(1) hue-rotate(205deg) saturate(.55) brightness(.72) contrast(1.2)}
.mapw::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:400;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(5,15,43,.55) 100%)}
.top{position:absolute;top:14px;inset-inline-end:14px;z-index:900;display:flex;gap:8px;align-items:center}
.pill{background:rgba(7,26,69,.82);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:center}
.pill button{font:inherit;font-size:11.5px;font-weight:700;color:var(--mut);background:none;border:0;padding:3px 7px;border-radius:7px;cursor:pointer}
.pill button.on{background:var(--gold);color:#1a1300}
.demo{background:rgba(242,183,46,.14);border-color:rgba(242,183,46,.5);color:var(--gold);letter-spacing:1px;font-size:11px;font-weight:800}
.clock{font-variant-numeric:tabular-nums}
.hint{position:absolute;bottom:16px;inset-inline-start:16px;z-index:900;font-size:11px;color:var(--mut);background:rgba(7,26,69,.7);padding:6px 10px;border-radius:9px;border:1px solid var(--line)}
.det{position:absolute;top:66px;inset-inline-end:14px;width:336px;z-index:900;background:rgba(7,22,60,.86);backdrop-filter:blur(14px);border:1px solid rgba(242,183,46,.35);border-radius:18px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.55);transition:.3s}
.det.h{opacity:0;pointer-events:none;transform:translateY(-8px)}
.det h2{font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.det h2 button{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer;line-height:1}
.det .sub{font-size:12px;color:var(--mut);margin:3px 0 12px}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px 8px;text-align:center}
.g svg{width:100%;height:auto;display:block}
.g small{display:block;font-size:10px;color:var(--mut);letter-spacing:.8px;text-transform:uppercase;font-weight:600}
.g b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:-6px}
.g b u{text-decoration:none;font-size:10px;color:var(--mut);font-weight:500;margin-inline-start:2px}
.rows{margin-top:12px}
.row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.row span{color:var(--mut)}.row b{font-weight:700;font-variant-numeric:tabular-nums}
.prog{margin-top:12px}
.prog .l{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:6px}
.prog .l span{color:var(--mut)}
.pb{height:8px;background:rgba(255,255,255,.08);border-radius:9px;position:relative}
.pb i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,var(--navy),var(--gold))}
.pb s{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 12px var(--gold)}
.spark{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.spark small{font-size:10px;color:var(--mut);letter-spacing:.8px;text-transform:uppercase;font-weight:600;display:flex;justify-content:space-between}
.spark svg{width:100%;height:44px;display:block;margin-top:4px}
.mk{position:relative;width:0;height:0;direction:ltr}
.g b,.row b.n,.kpi b,.v .r b,.prog .l,.spark small span:last-child{direction:ltr;unicode-bidi:isolate}
.mk .p{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,rgba(242,183,46,.45),transparent 70%);animation:mp 2.2s infinite}
@keyframes mp{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.mk .b{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;background:var(--navy2);border:2.5px solid var(--c,#fff);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 14px var(--c)}
.mk .b svg{width:16px;height:16px;transition:transform .2s linear}
.mk .t{position:absolute;left:20px;top:-12px;white-space:nowrap;background:rgba(7,22,60,.92);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:3px 8px;font:700 11px Inter,sans-serif;color:#fff}
.mk .t i{font-style:normal;color:var(--gold);margin-inline-start:5px}
.mk.sel .b{border-width:3px;width:36px;height:36px;left:-18px;top:-18px;--c:#f2b72e}
.mk.sel .t{border-color:var(--gold);left:24px}
.mk.low .b{border-color:var(--bad);box-shadow:0 0 18px var(--bad)}
.poi{width:26px;height:26px;border-radius:8px;background:var(--gold);color:#1a1300;display:grid;place-items:center;font:800 12px Inter;box-shadow:0 0 16px rgba(242,183,46,.6);border:2px solid #fff}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{background:rgba(7,22,60,.7)!important;color:#7f93c6!important;font-size:9px!important}
.leaflet-control-attribution a{color:#9fb2e6!important}
.leaflet-control-zoom a{background:rgba(7,26,69,.88)!important;color:#fff!important;border-color:rgba(255,255,255,.12)!important}
@media(max-width:900px){.det .rows,.det .spark{display:none}.det{padding:12px}.det .gs{gap:6px}.app{grid-template-rows:55vh 1fr}.app{grid-template-columns:1fr;.side{order:2}.mapw{order:1}.det{width:calc(100% - 28px);top:auto;bottom:14px}.hint{display:none}.brand img{width:64px}.top{flex-wrap:wrap}}
</style>
</head>

{id:'TRX-08',ty:'lux',cat:'vip',dr:['Tarek Nabil','طارق نبيل'],r:'r8',a:'apt',b:'nco',seats:6,pax:2,tank:75,l100:11.9,fuel:.9,p:.08,vs:66,m:'Mercedes V-Class',ma:'مرسيدس في كلاس'},
{id:'TRX-09',ty:'sedan',cat:'air',dr:['Sherif Mounir','شريف منير'],r:'r9',a:'gz',b:'dwn',seats:4,pax:2,tank:50,l100:8.0,fuel:.77,p:.55,vs:50}
];
const COL={van:'#5ab0ff',sedan:'#e8eefc',lux:'#f2b72e'};
const ICON=c=>`<svg viewBox="0 0 24 24" fill="${c}"><path d="M12 2l7 19-7-4-7 4z"/></svg>`;
const CAR={van:c=>`<svg viewBox="0 0 32 32" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V12a3 3 0 013-3h13l6 5 3 2v5"/><path d="M3 21h3m4 0h9m4 0h3"/><circle cx="8" cy="21" r="2.2"/><circle cx="22" cy="21" r="2.2"/><path d="M9 9v5m6-5v5"/></svg>`,
sedan:c=>`<svg viewBox="0 0 32 32" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20v-4l3-1 3-5h10l4 5 5 1v4"/><path d="M3 20h3m4 0h10m4 0h5"/><circle cx="8" cy="20" r="2.4"/><circle cx="24" cy="20" r="2.4"/><path d="M12 10v5m6-5l3 5"/></svg>`,
lux:c=>`<svg viewBox="0 0 32 32" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20v-4l4-1 3-4h9l5 4 5 1v4"/><path d="M3 20h3m4 0h10m4 0h5"/><circle cx="8" cy="20" r="2.4"/><circle cx="24" cy="20" r="2.4"/><path d="M13 5l2 2 2-3 2 3 2-2"/></svg>`};
let lang='en',mult=20,follow=true,sel=null,filt='all';
const $=s=>document.querySelector(s);
const tr=k=>T[lang][k];
// geometry
function prep(rt){const g=rt.g,cum=[0];for(let i=1;i<g.length;i++){cum.push(cum[i-1]+hav(g[i-1],g[i]))}rt.cum=cum;rt.len=cum[cum.length-1]}
function hav(a,b){const R=6371000,t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
for(const k in ROUTES)prep(ROUTES[k]);
function at(rt,s){s=Math.max(0,Math.min(rt.len,s));let lo=0,hi=rt.cum.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(rt.cum[m]<=s)lo=m;else hi=m}
const f=(s-rt.cum[lo])/((rt.cum[hi]-rt.cum[lo])||1),a=rt.g[lo],b=rt.g[hi];
const hd=Math.atan2((b[1]-a[1])*Math.cos(a[0]*Math.PI/180),b[0]-a[0])*180/Math.PI;
return{ll:[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f],hd,i:lo}}
// map
const map=L.map('map',{zoomControl:false,attributionControl:true,zoomSnap:.25,preferCanvas:false}).setView([30.04,31.2],10.5);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
function poi(ll,txt){L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="poi">${txt}</div>`,iconSize:[26,26],iconAnchor:[13,13]}),interactive:false}).addTo(map)}
poi(ROUTES.r1.g[0],'T');poi(ROUTES.r6.g[0],'✈');
// vehicles
const V=FL.map((f,i)=>{const rt=ROUTES[f.r];const o=Object.assign({},f);o.rt=rt;o.s=rt.len*f.p;o.dir=i%2?-1:1;o.v=f.vs/3.6*.8;o.vt=f.vs/3.6;o.fl=f.fuel*f.tank;o.used=Math.random()*9+4;o.km=Math.random()*60+25;o.inst=f.l100;o.dwell=0;o.hist=Array(60).fill(f.l100);o.ph=Math.random()*100;o.low=false;o.cons=f.l100;
o.line=L.polyline(rt.g,{color:'#6f8ee0',weight:3,opacity:.28,interactive:false}).addTo(map);
const c=COL[f.ty];
o.el=L.divIcon({className:'',html:`<div class="mk"><div class="p"></div><div class="b" style="--c:${c}">${ICON(c)}</div><div class="t">${f.id}<i></i></div></div>`,iconSize:[0,0]});
o.mk=L.marker(at(rt,o.s).ll,{icon:o.el,zIndexOffset:f.ty==='lux'?500:0}).addTo(map);
o.mk.on('click',()=>select(f.id));
return o});
const $ev=$('#evl');
function clk(){return new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Cairo',hour:'2-digit',minute:'2-digit'})}
function log(txt,warn){const d=document.createElement('div');if(warn)d.className='w';d.innerHTML=`<time>${clk()}</time><span>${txt}</span>`;$ev.prepend(d);while($ev.children.length>6)$ev.lastChild.remove()}
const nm=(p)=>P[p][lang==='en'?0:1];
const L1=lang=>lang;
function vname(o){return lang==='en'?(o.m||tr('ty')[o.ty]):(o.ma||tr('ty')[o.ty])}
function dest(o){return o.dir>0?o.b:o.a}function orig(o){return o.dir>0?o.a:o.b}
// list
function renderTabs(){const t=[['all',tr('all')],['emp',tr('emp')],['air',tr('air')],['vip',tr('vip')]];$('#tabs').innerHTML=t.map(x=>`<button class="tab ${filt===x[0]?'on':''}" data-f="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filt=b.dataset.f;renderTabs();renderList()})}
function renderList(){const l=$('#list');l.innerHTML='';V.filter(o=>filt==='all'||o.cat===filt).forEach(o=>{const d=document.createElement('div');d.className='v'+(sel===o.id?' sel':'');d.dataset.id=o.id;
d.innerHTML=`<div class="ic">${CAR[o.ty](COL[o.ty])}</div><div><div class="n">${o.id}<em class="${o.ty==='lux'?'lux':''}">${o.ty==='lux'?'VIP':o.cat==='air'?'AIR':'CORP'}</em></div><div class="d"></div><div class="fb"><i></i></div></div><div class="r"><b></b><span></span></div>`;
d.onclick=()=>select(o.id);o.row=d;l.appendChild(d)});updateRows()}
function updateRows(){V.forEach(o=>{if(!o.row||!o.row.isConnected)return;const r=o.row;r.querySelector('.d').textContent=o.dr[lang==='en'?0:1]+' · '+nm(orig(o))+' → '+nm(dest(o));
const p=o.fl/o.tank*100,f=r.querySelector('.fb i');f.style.width=p.toFixed(1)+'%';f.classList.toggle('low',p<22);
r.querySelector('.r b').innerHTML=Math.round(o.v*3.6)+'<u>'+tr('kmh')+'</u>';r.querySelector('.r span').textContent=o.dwell>0?tr('stop'):eta(o)+' '+tr('min')})}
function eta(o){const rem=o.dir>0?o.rt.len-o.s:o.s;const v=Math.max(o.vs/3.6*.8,5);return Math.max(1,Math.round(rem/v/60))}
// gauges
function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a),cy-r*Math.sin(a)];const s=p(a0),e=p(a1);return `M${s[0]} ${s[1]} A${r} ${r} 0 ${Math.abs(a0-a1)>Math.PI?1:0} 1 ${e[0]} ${e[1]}`}
function gauge(id,col){return `<svg viewBox="0 0 120 74"><path d="${arc(60,64,46,Math.PI,0)}" stroke="rgba(255,255,255,.1)" stroke-width="9" fill="none" stroke-linecap="round"/><path id="${id}" d="${arc(60,64,46,Math.PI,Math.PI)}" stroke="${col}" stroke-width="9" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${col})"/></svg>`}
function setG(id,f,col){const e=$('#'+id);if(!e)return;f=Math.max(.001,Math.min(1,f));e.setAttribute('d',arc(60,64,46,Math.PI,Math.PI-Math.PI*f));if(col)e.setAttribute('stroke',col)}
function renderDet(){const o=V.find(x=>x.id===sel),d=$('#det');if(!o){d.classList.add('h');return}d.classList.remove('h');
d.innerHTML=`<h2><span>${o.id} · ${vname(o)}</span><button id="x">×</button></h2><div class="sub" id="dsub"></div>
<div class="gs"><div class="g">${gauge('gs','#5ab0ff')}<b id="gsv"></b><small>${tr('speed')}</small></div><div class="g">${gauge('gf','#f2b72e')}<b id="gfv"></b><small>${tr('fuel')}</small></div></div>
<div class="prog"><div class="l"><b id="pr"></b><span id="pe"></span></div><div class="pb"><i id="pbi"></i><s id="pbs"></s></div></div>
<div class="rows"><div class="row"><span>${tr('driver')}</span><b>${o.dr[lang==='en'?0:1]}</b></div><div class="row"><span>${tr('pax')}</span><b>${o.pax} ${tr('of')} ${o.seats}</b></div><div class="row"><span>${tr('cons')}</span><b class="n" id="dc"></b></div><div class="row"><span>${tr('used')}</span><b class="n" id="du"></b></div><div class="row"><span>${tr('dist')}</span><b class="n" id="dd"></b></div></div>
<div class="spark"><small><span>${tr('spark')}</span><span id="sv"></span></small><svg viewBox="0 0 300 44" preserveAspectRatio="none"><path id="sp" fill="none" stroke="#f2b72e" stroke-width="2"/><path id="sf" fill="rgba(242,183,46,.12)"/></svg></div>`;
$('#x').onclick=()=>select(null)}
function updDet(){const o=V.find(x=>x.id===sel);if(!o||!$('#gs'))return;const kmh=o.v*3.6;setG('gs',kmh/120);const p=o.fl/o.tank;setG('gf',p,p<.22?'#ff5d6c':'#f2b72e');
$('#gsv').innerHTML=Math.round(kmh)+'<u>'+tr('kmh')+'</u>';$('#gfv').innerHTML=Math.round(p*100)+'<u>% · '+o.fl.toFixed(1)+' L</u>';
$('#dsub').textContent=nm(orig(o))+' → '+nm(dest(o));
const rem=o.dir>0?o.rt.len-o.s:o.s,tot=o.rt.len,done=o.dir>0?o.s/tot:1-o.s/tot;
$('#pr').textContent=(rem/1000).toFixed(1)+' km '+tr('remain');$('#pe').textContent=tr('eta')+' '+eta(o)+' '+tr('min');
$('#pbi').style.cssText=`left:0;width:${done*100}%`;$('#pbs').style.left=done*100+'%';
$('#dc').textContent=o.v>1?o.cons.toFixed(1)+' '+tr('l100'):'idle';$('#du').textContent=o.used.toFixed(2)+' L';$('#dd').textContent=o.km.toFixed(1)+' km';
$('#sv').textContent=o.cons.toFixed(1)+' '+tr('l100');
const h=o.hist,mn=Math.min(...h)-.5,mx=Math.max(...h)+.5;const pts=h.map((v,i)=>[i/(h.length-1)*300,42-(v-mn)/(mx-mn)*38]);
const dd=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');$('#sp').setAttribute('d',dd);$('#sf').setAttribute('d',dd+' L300 44 L0 44Z')}
let trail=null,flying=false;
function select(id){sel=id;document.querySelectorAll('.v').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));V.forEach(o=>{o.line.setStyle({opacity:o.id===id?.85:.28,color:o.id===id?'#f2b72e':'#6f8ee0',weight:o.id===id?4:3});const e=o.mk.getElement();if(e){const m=e.querySelector('.mk');m&&m.classList.toggle('sel',o.id===id)}if(o.id===id)o.line.bringToFront()});
renderDet();if(id){const o=V.find(x=>x.id===id);flying=true;map.once('moveend',()=>{flying=false});map.flyTo(o.mk.getLatLng(),12.75,{duration:1.6});}}
// sim
let last=performance.now(),ft=0;
function step(now){const dt=Math.min(.1,(now-last)/1000);last=now;const sd=dt*mult;let act=0,pax=0,km=0,fu=0;
V.forEach(o=>{
 if(o.dwell>0){o.dwell-=sd;o.v*=Math.max(0,1-dt*6);if(o.v<.3)o.v=0;if(o.dwell<=0){o.dir*=-1;o.dwell=0;log(`${o.id} ${tr('departed')} ${nm(dest(o))}`)}}
 else{
  const rem=o.dir>0?o.rt.len-o.s:o.s;
  o.ph+=sd*.02;let k=.7+.3*Math.sin(o.ph)+.12*Math.sin(o.ph*2.7+1);
  let tgt=o.vt*Math.max(.25,Math.min(1.25,k));
  if(rem<350)tgt=Math.min(tgt,rem/350*o.vt+2);
  const trs=Math.min(o.dir>0?o.s:o.rt.len-o.s,350);if(trs<350)tgt=Math.min(tgt,trs/350*o.vt+3);
  const ac=tgt>o.v?2.2:3.4;o.v+=(tgt-o.v)*Math.min(1,dt*ac*1.2);
  const ds=o.v*sd;o.s+=o.dir*ds;o.km+=ds/1000;
  const x=o.v*3.6/100;const f=o.l100*(1.3-.9*x*1.1+1.0*(x*1.1)**2)*(1+.05*Math.sin(o.ph*9));
  o.inst=f;o.cons+=(f-o.cons)*Math.min(1,dt*2);
  const l=ds*f/1e5;o.fl-=l;o.used+=l;
  if(o.s>=o.rt.len&&o.dir>0||o.s<=0&&o.dir<0){o.s=Math.max(0,Math.min(o.rt.len,o.s));o.dwell=14+Math.random()*10;log(`${o.id} ${tr('arrived')} ${nm(dest(o))}`)}
 }
 if(o.dwell>0){const l=sd*.00035;o.fl-=l;o.used+=l}
 const pct=o.fl/o.tank;const lw=pct<.22;
 if(lw&&!o.low){o.low=true;log(`${o.id} ${tr('lowf')} (${Math.round(pct*100)}%)`,true)}
 if(o.low!==undefined){const m=o.mk.getElement();if(m){m.firstChild.classList.toggle('low',lw)}}
 const p=at(o.rt,o.s);o.mk.setLatLng(p.ll);
 const m=o.mk.getElement();if(m){const hd=o.dir>0?p.hd:p.hd+180;const ic=m.querySelector('.b svg');if(ic)ic.style.transform=`rotate(${hd}deg)`;const t=m.querySelector('.t');if(t)t.firstChild.nodeValue=o.id;const i=t.querySelector('i');i.textContent=Math.round(o.v*3.6)+' '+tr('kmh')}
 if(o.v>.5)act++;pax+=o.pax;km+=o.km;fu+=o.used;o.ll=p.ll});
 ft+=dt;if(ft>.35){ft=0;V.forEach(o=>{o.hist.push(o.cons);o.hist.shift()});updateRows();updDet();
  $('#k1').textContent=V.length;$('#k2').textContent=pax;$('#k3').innerHTML=km.toFixed(0)+'<u>km</u>';$('#k4').innerHTML=fu.toFixed(1)+'<u>L</u>';
  $('#clock').textContent=clk()+' Cairo'}
 if(follow&&sel&&!flying){const o=V.find(x=>x.id===sel);map.panTo(o.mk.getLatLng(),{animate:false})}
 requestAnimationFrame(step)}
// i18n
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.className=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));$('#lang').textContent=lang==='en'?'العربية':'English';renderTabs();renderList();renderDet()}
$('#lang').onclick=()=>{lang=lang==='en'?'ar':'en';applyLang()};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mult=+b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b))});
$('#fol').onclick=function(){follow=!follow;this.classList.toggle('on',follow)};
map.on('dragstart',()=>{if(follow){follow=false;$('#fol').classList.remove('on')}});
applyLang();
V.forEach(o=>{const p=at(o.rt,o.s);o.mk.setLatLng(p.ll)});
const bounds=L.latLngBounds(V.map(o=>o.mk.getLatLng()));map.fitBounds(bounds.pad(.15));
if(innerWidth>900)setTimeout(()=>{select('TRX-04')},1500);
log('Demo fleet connected: 9 vehicles');
requestAnimationFrame(step);
</script>
